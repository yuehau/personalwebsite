<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Workspace — Yue Hau · Allianz</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --line:#e2e4e9; --line2:#eef0f3;
  --ink:#1c2430; --ink2:#5b6675; --ink3:#8a93a2;
  --accent:#3b5bdb; --accent-soft:#e8edfb; --accent-ink:#2b46b8;
  --green:#2f9e44; --green-soft:#e6f4ea; --amber:#e8930c; --amber-soft:#fdf0dc;
  --red:#d6455d; --red-soft:#fbe7ea; --violet:#7048e8; --violet-soft:#efe9fd;
  --teal:#0b7285; --teal-soft:#e3f3f5;
  --side:#171e2b; --side-ink:#aeb6c4; --side-active:#232d40;
  --shadow:0 1px 2px rgba(20,26,40,.06),0 4px 14px rgba(20,26,40,.05);
  --r:8px; --f:12.5px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:400 var(--f)/1.45 -apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#c8cdd6;border-radius:5px;border:2px solid var(--bg)}

/* ---------- layout ---------- */
#app{display:grid;grid-template-columns:216px 1fr;grid-template-rows:48px 1fr;height:100vh}
#sidebar{grid-row:1/3;background:var(--side);display:flex;flex-direction:column;overflow-y:auto}
#topbar{display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
#main{overflow-y:auto;padding:18px 22px 40px}

/* ---------- sidebar ---------- */
.brand{display:flex;align-items:center;gap:10px;padding:14px 16px 12px;border-bottom:1px solid #232d40}
.brand .logo{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,#3b5bdb,#7048e8);display:grid;place-items:center;font-weight:700;color:#fff;font-size:13px}
.brand b{color:#fff;font-size:13px;display:block;line-height:1.2}
.brand span{color:var(--side-ink);font-size:10.5px}
.navgrp{padding:12px 10px 2px;font-size:10px;letter-spacing:.09em;color:#5f6b80;text-transform:uppercase;font-weight:600}
.nav{display:flex;align-items:center;gap:9px;width:100%;padding:7px 12px;margin:1px 6px;width:calc(100% - 12px);border-radius:6px;color:var(--side-ink);font-size:12.5px;text-align:left}
.nav:hover{background:#1e2739;color:#dfe4ec}
.nav.active{background:var(--side-active);color:#fff;font-weight:600}
.nav .ico{width:16px;text-align:center;font-size:13px;opacity:.9}
.nav .cnt{margin-left:auto;font-size:10px;background:#2a3549;color:#9aa6ba;border-radius:8px;padding:1px 7px}
.side-foot{margin-top:auto;padding:12px 16px;border-top:1px solid #232d40;color:#5f6b80;font-size:10.5px}

/* ---------- topbar ---------- */
#crumb{font-weight:600;font-size:13.5px;white-space:nowrap}
#gsearch{flex:1;max-width:420px;position:relative}
#gsearch input{width:100%;padding:6px 10px 6px 30px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:12px}
#gsearch .mag{position:absolute;left:10px;top:6px;color:var(--ink3)}
#gsr{position:absolute;top:34px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);max-height:320px;overflow:auto;display:none;z-index:60}
#gsr .hit{padding:7px 12px;border-bottom:1px solid var(--line2);cursor:pointer;display:flex;gap:8px;align-items:baseline}
#gsr .hit:hover{background:var(--accent-soft)}
#gsr .hit small{color:var(--ink3)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.sync-chip{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink2);border:1px solid var(--line);border-radius:14px;padding:3px 10px;background:var(--bg)}
.sync-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--amber)}
.sync-chip.on .dot{background:var(--green)}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:500;color:var(--ink)}
.btn:hover{border-color:#c3c9d4;background:#fafbfc}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-ink)}
.btn.sm{padding:3px 8px;font-size:11px}
.btn.ghost{border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--line2)}
.btn.danger{color:var(--red);border-color:#f0c8cf}
.chip{display:inline-block;padding:1px 8px;border-radius:9px;font-size:10.5px;font-weight:600;white-space:nowrap}
.c-blue{background:var(--accent-soft);color:var(--accent-ink)} .c-green{background:var(--green-soft);color:var(--green)}
.c-amber{background:var(--amber-soft);color:#b26e00} .c-red{background:var(--red-soft);color:var(--red)}
.c-violet{background:var(--violet-soft);color:var(--violet)} .c-teal{background:var(--teal-soft);color:var(--teal)}
.c-grey{background:var(--line2);color:var(--ink2)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.p-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line2)}
.p-head h3{font-size:12.5px;font-weight:650}
.p-head .sub{color:var(--ink3);font-size:11px}
.p-head .spacer{margin-left:auto}
.p-body{padding:12px 14px}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sec-head h2{font-size:17px;font-weight:700}
.sec-head .sub{color:var(--ink2);font-size:12px}
.sec-head .spacer{margin-left:auto}

/* tables */
table.grid{width:100%;border-collapse:collapse;font-size:12px}
table.grid th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);font-weight:600;text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);background:#fafbfc;position:sticky;top:0}
table.grid td{padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.grid tr.row:hover td{background:#f6f8fd;cursor:pointer}
.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--ink3)} .b{font-weight:600}
.avatar{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:10px;font-weight:700;color:#fff;margin-right:8px;vertical-align:middle}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;box-shadow:var(--shadow)}
.kpi .k-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:600}
.kpi .k-val{font-size:21px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .k-sub{font-size:11px;color:var(--ink2)}
.kpi.warn .k-val{color:var(--red)}
.bar{height:5px;background:var(--line2);border-radius:3px;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

.dash-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px}
.list-row{display:flex;align-items:center;gap:10px;padding:7px 14px;border-bottom:1px solid var(--line2);font-size:12px}
.list-row:last-child{border-bottom:none}
.list-row:hover{background:#f6f8fd}
.empty{padding:22px;text-align:center;color:var(--ink3);font-size:12px}

/* kanban */
.board-tabs{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btab{padding:5px 12px;border-radius:6px;font-size:12px;border:1px solid var(--line);background:#fff;color:var(--ink2)}
.btab.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.kanban{display:flex;gap:12px;align-items:flex-start;overflow-x:auto;padding-bottom:14px}
.kcol{min-width:246px;width:246px;background:#eceef2;border:1px solid var(--line);border-radius:var(--r);flex-shrink:0}
.kcol-h{display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2)}
.kcol-h .cnt{background:#dde0e7;border-radius:8px;padding:0 7px;font-size:10.5px}
.kcards{padding:4px 8px 8px;min-height:40px;display:flex;flex-direction:column;gap:7px}
.kcard{background:#fff;border:1px solid var(--line);border-radius:7px;padding:9px 11px;box-shadow:0 1px 2px rgba(20,26,40,.07);cursor:grab;font-size:12px}
.kcard:active{cursor:grabbing}
.kcard .kt{font-weight:600;margin-bottom:3px}
.kcard .kmeta{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;align-items:center}
.kcard .due{font-size:10.5px;color:var(--ink3)}
.kcard .due.over{color:var(--red);font-weight:600}
.kcards.drag-over{outline:2px dashed var(--accent);outline-offset:-4px;border-radius:7px;background:var(--accent-soft)}
.kadd{width:calc(100% - 16px);margin:0 8px 8px;padding:5px;border:1px dashed #c3c9d4;border-radius:6px;color:var(--ink3);font-size:11.5px}
.kadd:hover{color:var(--accent);border-color:var(--accent)}

/* calendar */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cal-head b{font-size:14px;min-width:150px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line)}
.cal .dow{background:#fafbfc;padding:6px;text-align:center;font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase}
.cal .day{background:#fff;min-height:96px;padding:5px 6px;font-size:11px;display:flex;flex-direction:column;gap:3px;border:0;margin:0 0 1px 1px}
.cal .day .dnum{font-size:11px;color:var(--ink3);font-weight:600}
.cal .day.other{background:#f7f8fa}
.cal .day.today .dnum{background:var(--accent);color:#fff;border-radius:50%;width:19px;height:19px;display:inline-grid;place-items:center}
.cal .day:hover{background:#f2f5fd;cursor:pointer}
.cev{border-radius:4px;padding:1.5px 6px;font-size:10.5px;font-weight:600;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.cev.Planned{background:var(--amber-soft);color:#96600a}
.cev.Drafted{background:var(--accent-soft);color:var(--accent-ink)}
.cev.Posted{background:var(--green-soft);color:var(--green)}

/* surveys */
.sv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
.sv-col-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:700;font-size:12.5px}
.sv-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer}
.sv-card:hover{border-color:var(--accent)}
.sv-card h4{font-size:12.5px;margin-bottom:4px}
.sv-card .sv-meta{font-size:11px;color:var(--ink2);margin:2px 0}
.sv-card .bar{margin-top:8px}

/* templates */
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.tpl{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px}
.tpl h4{font-size:12.5px}
.tpl .body{font-size:11.5px;color:var(--ink2);background:#f7f8fa;border:1px solid var(--line2);border-radius:6px;padding:8px;white-space:pre-wrap;max-height:110px;overflow:auto}
.tpl .foot{display:flex;gap:6px;align-items:center;margin-top:auto}

/* drawer, modal, toast */
#overlay{position:fixed;inset:0;background:rgba(15,20,32,.45);display:none;z-index:80}
#drawer{position:fixed;top:0;right:-460px;width:450px;max-width:96vw;height:100vh;background:#fff;box-shadow:-8px 0 30px rgba(15,20,32,.18);z-index:90;transition:right .18s ease;display:flex;flex-direction:column}
#drawer.open{right:0}
.dw-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.dw-body{padding:14px 18px;overflow-y:auto;flex:1}
.dw-kv{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;font-size:12px;margin-bottom:14px}
.dw-kv dt{color:var(--ink3)} .dw-kv dd{font-weight:500}
#modal-wrap{position:fixed;inset:0;display:none;place-items:center;z-index:100;background:rgba(15,20,32,.45)}
#modal{background:#fff;border-radius:10px;width:520px;max-width:94vw;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(10,14,25,.3)}
#modal .m-head{padding:13px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:13.5px;display:flex;align-items:center}
#modal .m-body{padding:14px 18px;overflow-y:auto}
#modal .m-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.frow{display:flex;flex-direction:column;gap:3px}
.frow.full{grid-column:1/-1}
.frow label{font-size:10.5px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.frow input,.frow select,.frow textarea{padding:6px 9px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;background:#fff}
.frow textarea{min-height:64px;resize:vertical}
.frow input:focus,.frow select:focus,.frow textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1c2430;color:#fff;padding:8px 18px;border-radius:8px;font-size:12px;display:none;z-index:120;box-shadow:var(--shadow)}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filters select,.filters input{padding:5px 9px;border:1px solid var(--line);border-radius:6px;font-size:12px;background:#fff}
.wa{color:var(--green);font-weight:700;text-decoration:none;font-size:12px}
.wa:hover{text-decoration:underline}
@media(max-width:900px){#app{grid-template-columns:60px 1fr}.brand b,.brand span,.nav span.lbl,.navgrp,.side-foot,.nav .cnt{display:none}.dash-grid,.sv-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><div class="logo">YH</div><div><b>Agent Workspace</b><span>Allianz · Klang Valley</span></div></div>
    <div class="navgrp">Overview</div>
    <button class="nav active" data-view="dashboard"><span class="ico">◧</span><span class="lbl">Dashboard</span></button>
    <button class="nav" data-view="boards"><span class="ico">▤</span><span class="lbl">Boards</span></button>
    <div class="navgrp">Modules</div>
    <button class="nav" data-view="calendar"><span class="ico">▦</span><span class="lbl">Content Calendar</span><span class="cnt" id="n-cal"></span></button>
    <button class="nav" data-view="clients"><span class="ico">◉</span><span class="lbl">Client Directory</span><span class="cnt" id="n-cli"></span></button>
    <button class="nav" data-view="leads"><span class="ico">◎</span><span class="lbl">Leads</span><span class="cnt" id="n-led"></span></button>
    <button class="nav" data-view="surveys"><span class="ico">✓</span><span class="lbl">Survey Strategies</span><span class="cnt" id="n-svy"></span></button>
    <button class="nav" data-view="expenses"><span class="ico">◈</span><span class="lbl">Expenses</span><span class="cnt" id="n-exp"></span></button>
    <div class="navgrp">Communication</div>
    <button class="nav" data-view="templates"><span class="ico">✉</span><span class="lbl">Message Templates</span></button>
    <div class="navgrp">System</div>
    <button class="nav" data-view="settings"><span class="ico">⚙</span><span class="lbl">Settings & Sync</span></button>
    <div class="side-foot">v1.2 · offline-first<br>RM 0 / month</div>
  </aside>

  <header id="topbar">
    <span id="crumb">Dashboard</span>
    <div id="gsearch"><span class="mag">⌕</span><input id="gsi" placeholder="Search leads, clients, cards, content, surveys…  ( / )"><div id="gsr"></div></div>
    <div class="tb-right">
      <div class="sync-chip" id="syncchip"><span class="dot"></span><span id="synctxt">Local only</span></div>
      <button class="btn sm" id="syncbtn">Sync now</button>
      <button class="btn pri sm" id="quickadd">+ Quick add</button>
    </div>
  </header>

  <main id="main"></main>
</div>

<div id="overlay"></div>
<aside id="drawer"></aside>
<div id="modal-wrap"><div id="modal"></div></div>
<div id="toast"></div>

<script>
"use strict";
/* ============================================================
   UTILITIES
============================================================ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=> 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const nowISO=()=>new Date().toISOString();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtD=d=>{if(!d)return'—';const x=new Date(d);return isNaN(x)?'—':x.toLocaleDateString('en-MY',{day:'numeric',month:'short'})};
const fmtRM=n=>n||n===0?'RM '+Number(n).toLocaleString('en-MY'):'—';
const daysUntil=d=>{if(!d)return null;return Math.round((new Date(d+'T00:00:00')-new Date(todayISO()+'T00:00:00'))/86400000)};
const initials=n=>String(n||'?').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const avColor=n=>['#3b5bdb','#7048e8','#0b7285','#2f9e44','#e8930c','#d6455d'][String(n||'').length%6];
const stageChip={'New Lead':'c-grey','Contacted':'c-blue','Touch 2 - Resource':'c-teal','Appointment Set':'c-violet','Proposal Sent':'c-amber','Negotiation':'c-amber','Closed Won':'c-green','Closed Lost':'c-red'};
const prioChip={High:'c-red',Medium:'c-amber',Low:'c-grey'};
const langChip={BM:'c-teal',English:'c-blue',EN:'c-blue',CN:'c-violet',Mandarin:'c-violet'};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2200)}
function waLink(phone,text){const p=String(phone||'').replace(/[^0-9]/g,'');return 'https://wa.me/'+p+(text?'?text='+encodeURIComponent(text):'')}

/* ============================================================
   DATA LAYER  (localStorage now · Sheets sync-ready)
============================================================ */
const LS_KEY='agent_workspace_v1';
const ENTITIES=['leads','clients','content','boards','cards','surveys','responses','comms','templates','expenses'];
let DB=null;

const SETTINGS_DEFAULT={syncUrl:'',apiToken:'',lastSync:null,autoSync:true,mdrtTarget:540000,fycToDate:38500};
const EXP_CATS=['Transport (Grab/fuel/tolls)','Meals/Coffee (client meeting)','Booth/Event Fee','Marketing/Printing','Lead Magnet (PDF/design)','Software/Tools (subs)','Training/Course/MDRT','Gifts (client/festive)','Stationery','Other'];
const EXP_PAY=['Touch n Go','Cash','Credit Card','Debit Card','Online Banking'];

function seedTemplates(){
  const T=(name,category,language,body)=>({id:uid(),createdAt:nowISO(),updatedAt:nowISO(),deleted:false,name,category,language,body});
  return[
    T('First touch — form lead','Greeting','EN',"hi {name}, Yue Hau here 👋 got your form just now, thanks for that. no hard selling ya — I'll share info first, you decide at your own pace. quick one: is this more for yourself or for family?"),
    T('First touch — form lead','Greeting','BM',"hi {name}, saya Yue Hau 👋 dah terima form awak tadi. jangan risau, saya bukan jenis spam orang — saya share info dulu, awak decide ikut pace sendiri. nak tanya je, ini untuk diri sendiri ke untuk family?"),
    T('First touch — form lead','Greeting','CN',"嗨 {name}，我是 Yue Hau 👋 刚收到你的 form。放心，我不会一直推销的 — 先发资料给你慢慢看。想问一下，你是帮自己看，还是帮家人看的？"),
    T('Bump — resource sent','Follow-up','EN',"hey {name}, sempat tengok the plan I sent or not? 😅 no rush ya, just bumping in case it got buried. anything blur, just ask"),
    T('Bump — resource sent','Follow-up','BM',"hi {name}, sempat baca tak plan yang saya hantar hari tu? tak payah rush — saya cuma takut tenggelam dalam chat je 😄 apa-apa tak clear, terus tanya"),
    T('Bump — resource sent','Follow-up','CN',"{name}，上次发你的资料有空看了吗？不急哈，怕被其他 message 淹没了才提醒一下 😄 有不明白的直接问我"),
    T('Last check-in — gone quiet','Follow-up','EN',"hi {name}, I know things get busy — last check-in from me. still keen on this, or shall I park it for now? either way also ok, you can always come back to me later 🙂"),

function load(){try{const raw=localStorage.getItem(LS_KEY);if(raw){DB=JSON.parse(raw);DB.settings={...SETTINGS_DEFAULT,...(DB.settings||{})};ENTITIES.forEach(e=>DB[e]=DB[e]||[]);if((DB.settings.tplVersion||1)<2){DB.templates=seedTemplates();DB.settings.tplVersion=2;save()}return}}catch(e){}DB=seed();save()}
function save(){localStorage.setItem(LS_KEY,JSON.stringify(DB));updateCounts()}
function upsert(entity,row){row.updatedAt=nowISO();const arr=DB[entity];const i=arr.findIndex(r=>r.id===row.id);if(i>=0)arr[i]=row;else{row.id=row.id||uid();row.createdAt=row.createdAt||nowISO();arr.push(row)}save();queuePush(entity,row);return row}
function removeRow(entity,id){const r=DB[entity].find(r=>r.id===id);if(r){r.deleted=true;r.updatedAt=nowISO();save();queuePush(entity,r)}}
const alive=entity=>DB[entity].filter(r=>!r.deleted);

/* --- Sync engine (Apps Script Web App; see Workspace_App_Plan.md) --- */
let pushQueue=JSON.parse(localStorage.getItem(LS_KEY+'_q')||'[]');
function queuePush(entity,row){if(!DB.settings.syncUrl)return;pushQueue.push({entity,row});localStorage.setItem(LS_KEY+'_q',JSON.stringify(pushQueue));clearTimeout(queuePush._t);queuePush._t=setTimeout(flushQueue,1000)}
async function flushQueue(){if(!DB.settings.syncUrl||!pushQueue.length||!navigator.onLine)return;const batch=pushQueue.splice(0);localStorage.setItem(LS_KEY+'_q','[]');const byEnt={};batch.forEach(({entity,row})=>{(byEnt[entity]=byEnt[entity]||{})[row.id]=row});try{for(const[entity,rows]of Object.entries(byEnt)){await fetch(DB.settings.syncUrl,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'push',entity,rows:Object.values(rows),token:DB.settings.apiToken||''})})}setSync(true)}catch(e){pushQueue.push(...batch);localStorage.setItem(LS_KEY+'_q',JSON.stringify(pushQueue));setSync(false)}}
async function pullAll(manual){if(!DB.settings.syncUrl){if(manual)toast('No sync URL set — see Settings');return}try{const r=await fetch(DB.settings.syncUrl+'?action=pull'+(DB.settings.lastSync?'&since='+encodeURIComponent(DB.settings.lastSync):'')+(DB.settings.apiToken?'&token='+encodeURIComponent(DB.settings.apiToken):''));const j=await r.json();if(j&&j.ok!==false){ENTITIES.forEach(e=>{(j[e]||j.data?.[e]||[]).forEach(sr=>{const i=DB[e].findIndex(x=>x.id===sr.id);if(i<0)DB[e].push(sr);else if(new Date(sr.updatedAt)>new Date(DB[e][i].updatedAt))DB[e][i]=sr})});DB.settings.lastSync=nowISO();save();setSync(true);render();if(manual)toast('Synced')}}catch(e){setSync(false);if(manual)toast('Sync failed — check URL / connection')}}
function setSync(ok){const c=$('#syncchip');c.classList.toggle('on',!!ok);$('#synctxt').textContent=ok?('Synced '+new Date().toLocaleTimeString('en-MY',{hour:'2-digit',minute:'2-digit'})):(DB.settings.syncUrl?'Sync pending':'Local only')}
setInterval(()=>{if(DB?.settings.autoSync&&DB.settings.syncUrl)pullAll(false)},180000);
window.addEventListener('online',()=>flushQueue());
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&DB?.settings.autoSync&&DB.settings.syncUrl)pullAll(false)});

function formModal(title,fields,values,onSave,onDelete){
  const body='<div class="fgrid">'+fields.map(f=>{
    const v=values?.[f.key]??f.default??'';const full=f.full?' full':'';
    if(f.type==='select')return`<div class="frow${full}"><label>${f.label}</label><select data-k="${f.key}">${f.options.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
    if(f.type==='textarea')return`<div class="frow${full}"><label>${f.label}</label><textarea data-k="${f.key}">${esc(v)}</textarea></div>`;
    return`<div class="frow${full}"><label>${f.label}</label><input type="${f.type||'text'}" data-k="${f.key}" value="${esc(v)}"></div>`;
  }).join('')+'</div>';
  const foot=`<div>${onDelete?'<button class="btn danger sm" id="m-del">Delete</button>':''}</div><div style="display:flex;gap:8px"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" id="m-save">Save</button></div>`;
  openModal(title,body,foot);
  $('#m-save').onclick=()=>{const out={...(values||{})};$$('#modal [data-k]').forEach(el=>{out[el.dataset.k]=el.type==='number'?(el.value===''?'':Number(el.value)):el.value});onSave(out);closeModal()};
  if(onDelete)$('#m-del').onclick=()=>{if(confirm('Delete this item?')){onDelete();closeModal()}};
}

   BOARDS (kanban — Boards.com replacement)
============================================================ */
let curBoard=null,dragCard=null;
function rBoards(){
  const boards=alive('boards');if(!curBoard||!boards.find(b=>b.id===curBoard))curBoard=boards[0]?.id;
  const b=boards.find(x=>x.id===curBoard);
  $('#main').innerHTML=`
  <div class="sec-head"><h2>Boards</h2><span class="sub">drag cards between columns</span><span class="spacer"></span>
    <div class="board-tabs">${boards.map(x=>`<button class="btab ${x.id===curBoard?'active':''}" data-b="${x.id}">${esc(x.title)}</button>`).join('')}
    <button class="btn sm" id="newboard">+ Board</button>${b?`<button class="btn ghost sm" id="editboard">Edit</button>`:''}</div>
  </div>
  ${b?`<div class="kanban">${b.columns.map(col=>{
    const cards=alive('cards').filter(c=>c.boardId===b.id&&c.column===col).sort((a,c)=>(a.position||0)-(c.position||0));
    return`<div class="kcol"><div class="kcol-h">${esc(col)}<span class="cnt">${cards.length}</span></div>
      <div class="kcards" data-col="${esc(col)}">${cards.map(kCardHTML).join('')}</div>
      <button class="kadd" data-col="${esc(col)}">+ Add card</button></div>`;
  }).join('')}</div>`:'<div class="empty">No boards yet</div>'}`;
  $$('.btab').forEach(t=>t.onclick=()=>{curBoard=t.dataset.b;rBoards()});
  $('#newboard').onclick=()=>editBoard();
  const eb=$('#editboard');if(eb)eb.onclick=()=>editBoard(curBoard);
  $$('.kadd').forEach(btn=>btn.onclick=()=>editCard(null,btn.dataset.col));
  $$('.kcard').forEach(el=>{
    el.addEventListener('dragstart',()=>{dragCard=el.dataset.id;setTimeout(()=>el.style.opacity=.4,0)});
    el.addEventListener('dragend',()=>{el.style.opacity=1;dragCard=null});
    el.addEventListener('click',()=>editCard(el.dataset.id));
  });
  $$('.kcards').forEach(zone=>{
    zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('drag-over')});
    zone.addEventListener('dragleave',()=>zone.classList.remove('drag-over'));
    zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('drag-over');if(!dragCard)return;
      const c=DB.cards.find(x=>x.id===dragCard);if(!c)return;c.column=zone.dataset.col;
      c.position=alive('cards').filter(x=>x.boardId===c.boardId&&x.column===c.column).length;
      upsert('cards',c);
      if(c.linkType==='lead'&&c.linkId){const l=DB.leads.find(x=>x.id===c.linkId);const board=DB.boards.find(x=>x.id===c.boardId);if(l&&board?.kind==='pipeline'){l.stage=c.column;upsert('leads',l)}}
      rBoards();toast('Moved to '+c.column);
    });
  });
}
function kCardHTML(c){
  const du=daysUntil(c.dueDate);
  return`<div class="kcard" draggable="true" data-id="${c.id}"><div class="kt">${esc(c.title)}</div>
  ${c.description?`<div class="muted">${esc(c.description).slice(0,90)}</div>`:''}
  <div class="kmeta">${(c.labels||[]).map(l=>`<span class="chip ${l==='Hot'?'c-red':'c-grey'}">${esc(l)}</span>`).join('')}
  ${c.dueDate?`<span class="due ${du<0?'over':''}">⏱ ${fmtD(c.dueDate)}</span>`:''}
  ${c.linkType?`<span class="chip c-blue">↗ ${esc(contactName(c.linkType,c.linkId))}</span>`:''}</div></div>`;
}
function editBoard(id){
  const b=id?DB.boards.find(x=>x.id===id):null;
  formModal(b?'Edit board':'New board',[
    {key:'title',label:'Board title',full:true},
    {key:'kind',label:'Type',type:'select',options:['tasks','pipeline','custom']},
    {key:'colsText',label:'Columns (comma-separated)',full:true},
  ],b?{...b,colsText:b.columns.join(', ')}:{kind:'tasks',colsText:'To Do, In Progress, Done'},
  out=>{out.columns=out.colsText.split(',').map(s=>s.trim()).filter(Boolean);delete out.colsText;const row=upsert('boards',b?{...b,...out}:out);curBoard=row.id;rBoards()},
  b?()=>{removeRow('boards',b.id);alive('cards').filter(c=>c.boardId===b.id).forEach(c=>removeRow('cards',c.id));curBoard=null;rBoards()}:null);
}
function editCard(id,col){
  const c=id?DB.cards.find(x=>x.id===id):null;const b=DB.boards.find(x=>x.id===curBoard);
  const leadOpts=['(none)',...alive('leads').map(l=>l.fullName)];
  formModal(c?'Edit card':'New card',[
    {key:'title',label:'Title',full:true},
    {key:'description',label:'Description',type:'textarea',full:true},
    {key:'column',label:'Column',type:'select',options:b?b.columns:['To Do']},
    {key:'dueDate',label:'Due date',type:'date'},
    {key:'labelsText',label:'Labels (comma-separated)'},
    {key:'leadName',label:'Link to lead',type:'select',options:leadOpts},
  ],c?{...c,labelsText:(c.labels||[]).join(', '),leadName:c.linkType==='lead'?(contactName('lead',c.linkId)):'(none)'}:{column:col||b?.columns[0],labelsText:'',leadName:'(none)'},
  out=>{out.labels=out.labelsText.split(',').map(s=>s.trim()).filter(Boolean);delete out.labelsText;
    const lead=alive('leads').find(l=>l.fullName===out.leadName);out.linkType=lead?'lead':'';out.linkId=lead?lead.id:'';delete out.leadName;
    out.boardId=c?c.boardId:curBoard;upsert('cards',c?{...c,...out}:out);rBoards()},
  c?()=>{removeRow('cards',c.id);rBoards()}:null);
}

let calYM=todayISO().slice(0,7),calMode='month',calFilter={platform:'',language:'',status:''};
function rCalendar(){
  const all=alive('content').filter(c=>(!calFilter.platform||c.platform===calFilter.platform)&&(!calFilter.language||c.language===calFilter.language)&&(!calFilter.status||c.status===calFilter.status));
  const opts=(k,label)=>{const vals=[...new Set(alive('content').map(c=>c[k]).filter(Boolean))];return`<select data-f="${k}"><option value="">${label}: all</option>${vals.map(v=>`<option ${calFilter[k]===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`};
  $('#main').innerHTML=`
  <div class="sec-head"><h2>Content Calendar</h2><span class="sub">plan · draft · post — trilingual</span><span class="spacer"></span>
    <div class="filters">${opts('platform','Platform')}${opts('language','Language')}${opts('status','Status')}
    <button class="btn sm ${calMode==='month'?'pri':''}" data-m="month">Month</button><button class="btn sm ${calMode==='list'?'pri':''}" data-m="list">List</button>
    <button class="btn pri sm" id="addcontent">+ Post</button></div></div>
  <div id="calbody"></div>`;
  $$('[data-f]').forEach(s=>s.onchange=()=>{calFilter[s.dataset.f]=s.value;rCalendar()});
  $$('[data-m]').forEach(b=>b.onclick=()=>{calMode=b.dataset.m;rCalendar()});
  $('#addcontent').onclick=()=>editContent();
  calMode==='month'?calMonth(all):calList(all);
}
function calMonth(all){
  const[y,m]=calYM.split('-').map(Number);
  const first=new Date(y,m-1,1),start=new Date(first);start.setDate(1-((first.getDay()+6)%7)); // Monday start
  let cells='';const cur=new Date(start);
  const localISO=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  for(let i=0;i<42;i++){
    const iso=localISO(cur);const inMon=cur.getMonth()===m-1;
    const evs=all.filter(c=>c.date===iso);
    cells+=`<div class="day ${inMon?'':'other'} ${iso===todayISO()?'today':''}" data-d="${iso}"><span class="dnum">${cur.getDate()}</span>
      ${evs.map(c=>`<button class="cev ${c.status}" data-id="${c.id}" title="${esc(c.hook)}">${esc(c.platform[0])}·${esc(c.hook)}</button>`).join('')}</div>`;
    cur.setDate(cur.getDate()+1);
  }
  $('#calbody').innerHTML=`
  <div class="cal-head"><button class="btn sm" id="prevM">‹</button><b>${first.toLocaleDateString('en-MY',{month:'long',year:'numeric'})}</b><button class="btn sm" id="nextM">›</button>
    <span class="muted" style="margin-left:8px">■ <span class="chip c-amber">Planned</span> <span class="chip c-blue">Drafted</span> <span class="chip c-green">Posted</span></span></div>
  <div class="cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div>`;
  $('#prevM').onclick=()=>{const d=new Date(y,m-2,1);calYM=d.toISOString().slice(0,7);rCalendar()};
  $('#nextM').onclick=()=>{const d=new Date(y,m,1);calYM=d.toISOString().slice(0,7);rCalendar()};
  $$('.cev').forEach(el=>el.onclick=e=>{e.stopPropagation();editContent(el.dataset.id)});
  $$('.day').forEach(el=>el.onclick=()=>editContent(null,el.dataset.d));
}
function calList(all){
  $('#calbody').innerHTML=`<div class="panel" style="overflow:auto"><table class="grid"><thead><tr><th>Date</th><th>Platform</th><th>Format</th><th>Lang</th><th>Topic</th><th>Hook / Caption</th><th>CTA</th><th>Status</th><th>Engagement</th></tr></thead><tbody>
  ${all.sort((a,b)=>a.date.localeCompare(b.date)).map(c=>`<tr class="row" data-id="${c.id}"><td class="b">${fmtD(c.date)}</td><td>${esc(c.platform)}</td><td>${esc(c.format)}</td><td><span class="chip ${langChip[c.language]||'c-grey'}">${esc(c.language)}</span></td><td>${esc(c.topicBucket)}</td><td>${esc(c.hook)}</td><td class="muted">${esc(c.cta)}</td><td><span class="chip ${c.status==='Posted'?'c-green':c.status==='Drafted'?'c-blue':'c-amber'}">${esc(c.status)}</span></td><td class="muted">${esc(c.engagement||'—')}</td></tr>`).join('')||'<tr><td colspan="9" class="empty">No posts match filters</td></tr>'}
  </tbody></table></div>`;
  $$('#calbody .row').forEach(r=>r.onclick=()=>editContent(r.dataset.id));
}

      </div>`}).join('')||'<div class="empty">None yet</div>'}</div>`;

  <div class="sec-head"><h2>Survey Strategies</h2><span class="sub">plan the question → run the campaign → capture the learning</span><span class="spacer"></span><button class="btn pri sm" onclick="editSurvey()">+ New survey</button></div>

  <div class="dw-head"><div style="flex:1"><span class="chip ${svStatusChip[s.status]}">${esc(s.status)}</span> <span class="chip c-grey">${svTypeLabel(s.type)}</span><b style="display:block;font-size:14px;margin-top:4px">${esc(s.title)}</b></div>

    ${s.hypothesis?`<div class="panel" style="padding:10px 12px;margin-bottom:12px"><b style="font-size:11px;text-transform:uppercase;color:var(--ink3)">Hypothesis</b><div>${esc(s.hypothesis)}</div></div>`:''}
    ${s.learnings?`<div class="panel" style="padding:10px 12px;margin-bottom:12px;border-left:3px solid var(--violet)"><b style="font-size:11px;text-transform:uppercase;color:var(--violet)">Learnings</b><div>${esc(s.learnings)}</div></div>`:''}

  </div>`);
}

function addResponse(surveyId){
  const s=DB.surveys.find(x=>x.id===surveyId);closeDrawer();
  const contacts=['(anonymous)',...alive('leads').map(l=>'Lead: '+l.fullName),...alive('clients').map(c=>'Client: '+c.name)];
  formModal('Log survey response',[
    {key:'contact',label:'Contact',type:'select',options:contacts,full:true},
    ...(s?.type==='nps'?[{key:'score',label:'Score (0-10)',type:'number'}]:[]),
    {key:'respondedAt',label:'Date',type:'date'},
    {key:'summary',label:'Key answers / summary',type:'textarea',full:true},
  ],{respondedAt:todayISO()},out=>{

  $('#cs-tpl').onchange=fill;fill();
  const doCopy=async()=>{const txt=$('#cs-body').value;try{await navigator.clipboard.writeText(txt)}catch(e){$('#cs-body').select();document.execCommand('copy')}toast('Copied — ready to paste')};
  $('#cs-copy').onclick=async()=>{await doCopy();closeModal()};
  $('#cs-wa').onclick=async()=>{await doCopy();window.open(waLink(person.whatsapp),'_blank');closeModal()};
}
function logComm(type,id){
  const contacts=[...alive('leads').map(l=>'Lead: '+l.fullName),...alive('clients').map(c=>'Client: '+c.name)];
  const pre=type==='client'?'Client: '+contactName('client',id):type==='lead'?'Lead: '+contactName('lead',id):contacts[0];
  closeDrawer();
  formModal('Log conversation',[
    {key:'who',label:'Contact',type:'select',options:contacts,full:true,default:pre},
    {key:'channel',label:'Channel',type:'select',options:['WhatsApp','Call','Email','Meeting']},
    {key:'direction',label:'Direction',type:'select',options:['out','in']},
    {key:'summary',label:'Summary',type:'textarea',full:true},
    {key:'nextAction',label:'Next action'},
    {key:'nextActionDate',label:'Next action date',type:'date'},
  ],{who:pre,channel:'WhatsApp',direction:'out'},out=>{
    let contactType='lead',contactId='';
    if(out.who.startsWith('Client: ')){contactType='client';contactId=alive('clients').find(c=>c.name===out.who.slice(8))?.id||''}
    else{contactId=alive('leads').find(l=>l.fullName===out.who.slice(6))?.id||''}
    delete out.who;upsert('comms',{...out,contactType,contactId,at:nowISO()});
    if(contactType==='lead'&&out.nextActionDate){const l=DB.leads.find(x=>x.id===contactId);if(l){l.nextFollowUp=out.nextActionDate;l.lastContact=todayISO();upsert('leads',l)}}
    render();toast('Logged');
  });
}

      <button class="btn sm" id="s-pack">Export agent starter pack</button>

    </div></div>
  </div>`;
  $('#s-save').onclick=()=>{DB.settings.syncUrl=$('#s-url').value.trim();DB.settings.apiToken=$('#s-token').value.trim();DB.settings.autoSync=$('#s-auto').checked;save();setSync(false);toast('Saved')};
  $('#s-save2').onclick=()=>{DB.settings.mdrtTarget=+$('#s-mdrt').value||540000;DB.settings.fycToDate=+$('#s-fyc').value||0;save();toast('Saved')};
  $('#s-export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,1)],{type:'application/json'}));a.download='agent_workspace_backup_'+todayISO()+'.json';a.click();toast('Backup downloaded')};
  $('#s-import').onclick=()=>$('#s-file').click();
  $('#s-pack').onclick=()=>{const strip=r=>{const{id,createdAt,updatedAt,deleted,...rest}=r;return{id,createdAt,updatedAt,deleted:false,...rest}};
    const pack={settings:{...SETTINGS_DEFAULT,tplVersion:2},leads:[],clients:[],content:[],comms:[],responses:[],surveys:[],cards:[],expenses:[],boards:alive('boards').map(strip),templates:alive('templates').map(strip)};
